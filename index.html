<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Home Electrical Panel</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1c1b">

<!-- iOS installability -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>

<div class="box" id="box">
  <div class="logo">ABB</div>
  <button class="more" id="moreBtn" type="button" aria-label="Options" aria-haspopup="menu" aria-expanded="false"><i></i><i></i><i></i></button>
  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" id="exportBtn">Export to JSON</button>
    <button type="button" role="menuitem" id="importBtn">Import from JSON</button>
    <p class="menu-note" id="menuNote"></p>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div class="frame" id="frame"></div>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dh"><h2 id="dlgTitle" tabindex="-1"></h2><p id="dlgSub"></p></div>
    <div class="db" id="dlgBody"></div>
    <div class="df">
      <button class="btn" value="cancel" type="submit">Cancel</button>
      <button class="btn primary" value="save" type="submit" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=7"></script>
</body>
</html>
